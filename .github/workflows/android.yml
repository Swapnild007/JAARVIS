name: Android verification
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
concurrency:
  group: jaarvis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew -Pkotlin.compiler.execution.strategy=in-process --no-daemon assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jaarvis-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew -Pkotlin.compiler.execution.strategy=in-process -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true connectedDebugAndroidTest
            mkdir -p ci-screenshots ci-reports
            cp -R app/build/reports/androidTests ci-reports/default
            adb pull /sdcard/Android/data/com.jaarvis.commandcenter/files/screenshots/ ci-screenshots/default
            adb shell wm size 720x1280
            adb shell wm density 320
            adb shell settings put system font_scale 1.5
            ./gradlew -Pkotlin.compiler.execution.strategy=in-process -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.class=com.jaarvis.CommandCenterTest connectedDebugAndroidTest
            cp -R app/build/reports/androidTests ci-reports/large-text
            adb pull /sdcard/Android/data/com.jaarvis.commandcenter/files/screenshots/ ci-screenshots/large-text
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jaarvis-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ci-screenshots/
            ci-reports/
